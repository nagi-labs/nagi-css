name: Release packages

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    environment: npm
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Vite Plus
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version: "24"
          cache: false
          run-install: true
      - name: Set up npm with staged publishing support
        run: |
          vp exec npm install --global npm@11.19.0
          test "$(vp exec npm --version)" = "11.19.0"
      - name: Verify release version
        if: startsWith(github.ref, 'refs/tags/')
        run: test "${GITHUB_REF_NAME}" = "v$(node -p \"require('./package.json').version\")"
      - name: Test
        run: vp run test
      - name: Prepare publishable packages
        run: vp run release:prepare
      - name: Pack core
        working-directory: .release/packages/core
        run: vp exec npm pack --pack-destination ../../tarballs
      - name: Pack ESLint plugin
        working-directory: .release/packages/eslint-plugin
        run: vp exec npm pack --pack-destination ../../tarballs
      - name: Pack CLI
        working-directory: .release/packages/cli
        run: vp exec npm pack --pack-destination ../../tarballs
      - name: Install packed packages
        working-directory: .release/smoke
        run: vp exec npm install --ignore-scripts --prefix .
      - name: Smoke test package entrypoints
        working-directory: .release/smoke
        run: |
          vp exec node -e 'import("@nagi-labs/nagi-css-core")'
          vp exec node -e 'import("@nagi-labs/eslint-plugin-nagi-css")'
          test -x node_modules/.bin/nagi-css
          vp exec node node_modules/@nagi-labs/nagi-css/src/cli.mjs --help
      - name: Stage core
        id: stage-core
        working-directory: .release/packages/core
        run: |
          if vp exec npm view "@nagi-labs/nagi-css-core@$(node -p \"require('./package.json').version\")" version >/dev/null 2>&1; then
            exit 0
          fi
          set +e
          stage_output=$(vp exec npm stage publish . --provenance 2>&1)
          stage_status=$?
          set -e
          printf '%s\n' "${stage_output}"
          if [ "${stage_status}" -ne 0 ]; then
            error_summary=$(printf '%s\n' "${stage_output}" | grep -E '^(npm error|npm ERR!)' | head -n 6 | tr '\n\r' '  ' | cut -c1-1000)
            error_summary=${error_summary//'%'/'%25'}
            echo "::error file=.github/workflows/release.yml,line=59,title=npm stage publish failed::${error_summary}"
            {
              echo '### npm stage publish failure'
              echo '```text'
              printf '%s\n' "${stage_output}"
              echo '```'
            } >> "${GITHUB_STEP_SUMMARY}"
            exit "${stage_status}"
          fi
      - name: Stage ESLint plugin
        working-directory: .release/packages/eslint-plugin
        run: vp exec npm view "@nagi-labs/eslint-plugin-nagi-css@$(node -p \"require('./package.json').version\")" version >/dev/null 2>&1 || vp exec npm stage publish . --provenance
      - name: Stage CLI
        working-directory: .release/packages/cli
        run: vp exec npm view "@nagi-labs/nagi-css@$(node -p \"require('./package.json').version\")" version >/dev/null 2>&1 || vp exec npm stage publish . --provenance
      - name: Upload npm diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: npm-release-diagnostics
          path: ~/.npm/_logs/
          retention-days: 1
